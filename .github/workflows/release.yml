name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mcp httpx pydantic pyinstaller
      
      - name: Build binary
        run: |
          chmod +x build.sh
          ./build.sh
      
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Determine platform
        id: platform
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            echo "PLATFORM=Linux x86_64" >> $GITHUB_OUTPUT
          elif [ "${{ runner.os }}" == "macOS" ]; then
            echo "PLATFORM=macOS" >> $GITHUB_OUTPUT
          elif [ "${{ runner.os }}" == "Windows" ]; then
            echo "PLATFORM=Windows x86_64" >> $GITHUB_OUTPUT
          fi
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ControlAPI-MCP ${{ steps.get_version.outputs.VERSION }} - Release (${{ steps.platform.outputs.PLATFORM }})"
          body_path: RELEASE_${{ steps.get_version.outputs.VERSION }}.md
          files: |
            dist/controlapi-mcp
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
