name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: controlapi-mcp-linux
          - os: macos-latest
            platform: macos
            artifact: controlapi-mcp-macos
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mcp httpx pydantic pyinstaller jsonpath-ng
      
      - name: Build binary
        run: |
          chmod +x build.sh
          ./build.sh
      
      - name: Rename binary with platform suffix
        run: mv dist/controlapi-mcp dist/${{ matrix.artifact }}
      
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
  
  create-release:
    needs: build-and-release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ControlAPI-MCP ${{ steps.get_version.outputs.VERSION }}"
          body_path: releases/RELEASE_${{ steps.get_version.outputs.VERSION }}.md
          files: |
            dist/controlapi-mcp-linux/controlapi-mcp-linux
            dist/controlapi-mcp-macos/controlapi-mcp-macos
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
